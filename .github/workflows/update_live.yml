name: Build Custom HLS Master Playlist

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  build-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Deno (JS Runtime) & yt-dlp
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "/home/runner/.deno/bin" >> $GITHUB_PATH

          sudo wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Setup Cookies File
        env:
          COOKIES_DATA: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          echo "$COOKIES_DATA" > cookies.txt

      - name: Extract Video and Audio Links
        run: |
          # Dapatkan URL Stream Video (Format hls / 96 / best)
          VIDEO_URL=$(yt-dlp --cookies cookies.txt --js-runtimes deno -f "bv*/b" -g "https://www.youtube.com/live/dEu_05KCnVA" | head -n 1)

          # Dapatkan URL Stream Audio (Format hls / ba / best)
          AUDIO_URL=$(yt-dlp --cookies cookies.txt --js-runtimes deno -f "ba*/b" -g "https://www.youtube.com/live/dEu_05KCnVA" | tail -n 1)

          # Cipta Master Playlist HLS
          cat <<EOF > live.m3u8
          #EXTM3U
          #EXT-X-VERSION:4
          #EXT-X-INDEPENDENT-SEGMENTS
          #EXT-X-MEDIA:TYPE=AUDIO,GROUP-ID="program_audio",NAME="YouTube Audio",DEFAULT=YES,AUTOSELECT=YES,URI="$AUDIO_URL"
          #EXT-X-STREAM-INF:BANDWIDTH=3405200,RESOLUTION=1280x720,AUDIO="program_audio"
          $VIDEO_URL
          EOF

      - name: Commit and Push to Github
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add live.m3u8
          git commit -m "Auto-update HLS master playlist [skip ci]" || exit 0
          git push
          
